
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px #00000015;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .color-box {
            width: 100%;
            height: 150px;
            background: #3498db;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 28px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }

        .generate {
            background: #2563eb;
            color: white;
        }

        .copy {
            background: #e2e8f0;
            color: #1e293b;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Random Color Generator</h1>

        <div class="color-box" id="colorBox"></div>

        <h2 id="hexCode">#3498DB</h2>

        <button class="generate" onclick="generateColor()">
            Generate Color
        </button>

        <button class="copy" onclick="copyColor()">
            Copy HEX
        </button>
    </div>

    <script>
        function generateColor() {
            let angka = "0123456789ABCDEF";
            let warna = "#";

            for (let i = 0; i < 6; i++) {
                warna += angka[Math.floor(Math.random() * 16)];
            }

            document.getElementById("colorBox").style.backgroundColor = warna;
            document.getElementById("hexCode").textContent = warna;
        }

        function copyColor() {
            let warna = document.getElementById("hexCode").textContent;

            navigator.clipboard.writeText(warna)
                .then(() => alert("Warna " + warna + " berhasil disalin!"))
                .catch(() => alert("Gagal menyalin warna."));
        }
    </script>

</body>
</html>
